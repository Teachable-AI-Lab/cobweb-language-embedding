[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobweb-language-embedding"
version = "0.1.0"
description = "Cobweb-based language embedding utilities for retrieval and topic modeling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Anant Gupta" },
  { name = "Karthik Singaravadivelan" },
  { name = "Zekun Wang" },
  { name = "Christopher J MacLellan" }
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "tqdm>=4.65",
  "graphviz>=0.20",
  "scikit-learn>=1.2"
]

[project.optional-dependencies]
retrieval = [
  "datasets>=2.18",
  "sentence-transformers>=2.5",
  "faiss-cpu>=1.7.4"
]
topic-modeling = [
  "bertopic>=0.16",
  "hdbscan>=0.8.33",
  "umap-learn>=0.5.5",
  "sentence-transformers>=2.5",
  "pandas>=2.0",
  "scipy>=1.10",
  "gensim>=4.3",
  "datasets>=2.18",
  "nltk>=3.8"
]
dev = [
  "pytest>=8.0"
]
all = [
  "datasets>=2.18",
  "sentence-transformers>=2.5",
  "faiss-cpu>=1.7.4",
  "bertopic>=0.16",
  "hdbscan>=0.8.33",
  "umap-learn>=0.5.5",
  "pandas>=2.0",
  "scipy>=1.10",
  "gensim>=4.3",
  "nltk>=3.8",
  "pytest>=8.0"
]

[project.urls]
Homepage = "https://github.com/Teachable-AI-Lab/cobweb-language-embedding"
Repository = "https://github.com/Teachable-AI-Lab/cobweb-language-embedding"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
